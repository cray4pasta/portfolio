<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview — Hero Background</title>

  <style>
    @font-face {
      font-family: 'Test Tiempos Headline';
      src: url('Fonts/Test Tiempos/Test Tiempos Headline/test-tiempos-headline-light.woff2') format('woff2'),
           url('Fonts/Test Tiempos/Test Tiempos Headline/TestTiemposHeadline-Light.otf') format('opentype');
      font-weight: 300; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Halyard Display';
      src: url('Fonts/Halyard Display/fonnts.com-Halyard_Display_Book.otf') format('opentype');
      font-weight: 400; font-style: normal; font-display: swap;
    }

    :root {
      --bg:         #fefcff;
      --text:       #111213;
      --border:     #cbcacc;
      --purple:     #6a5acd;
      --font-serif: 'Test Tiempos Headline', Georgia, serif;
      --font-sans:  'Halyard Display', 'Helvetica Neue', Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); }

    /* ── NAV (replicated for context) ── */
    nav {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      background: var(--bg);
    }
    .nav-inner {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo img { height: 41px; width: auto; display: block; }
    .nav-links { display: flex; gap: 28px; align-items: center; }
    .nav-links a {
      font-family: var(--font-sans);
      font-size: 24px;
      font-weight: 400;
      color: var(--text);
      text-decoration: none;
      padding: 12px 8px;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      display: flex;
      justify-content: center;
      padding: 200px 20px 120px;
      overflow: hidden;
    }
    .hero-inner {
      width: 100%;
      max-width: 936px;
      position: relative;
      z-index: 2;
    }
    .hero-text {
      font-family: var(--font-serif);
      font-size: 40px;
      font-weight: 300;
      line-height: 48px;
      color: var(--text);
    }

    /* ── MOUNTAIN BACKGROUND ── */
    .hero-mountain {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
    }
    .hero-mountain svg {
      width: 110%;
      max-width: 1400px;
      height: auto;
      margin-bottom: -2px;
    }

    /* ── ANIMATIONS ── */
    @keyframes fog-drift-a {
      0%   { transform: translateX(-28px); }
      100% { transform: translateX(28px); }
    }
    @keyframes fog-drift-b {
      0%   { transform: translateX(20px); }
      100% { transform: translateX(-20px); }
    }
    @keyframes fog-drift-c {
      0%   { transform: translateX(-14px) scaleX(1); }
      100% { transform: translateX(14px) scaleX(1.03); }
    }
    @keyframes scene-breathe {
      0%   { transform: scale(1) translateY(0px); }
      100% { transform: scale(1.006) translateY(-3px); }
    }
    @keyframes peak-glow {
      0%   { opacity: 0.18; }
      100% { opacity: 0.28; }
    }

    .mountain-scene {
      animation: scene-breathe 18s ease-in-out infinite alternate;
      transform-origin: center bottom;
    }
    .fog-a {
      animation: fog-drift-a 70s ease-in-out infinite alternate;
    }
    .fog-b {
      animation: fog-drift-b 55s ease-in-out infinite alternate;
    }
    .fog-c {
      animation: fog-drift-c 90s ease-in-out infinite alternate;
    }
    .peak-warm {
      animation: peak-glow 12s ease-in-out infinite alternate;
    }

    /* ── PREVIEW LABEL ── */
    .preview-label {
      font-family: var(--font-sans);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <div class="nav-logo">
        <img src="assets/Logo.svg" alt="Prerna Kashyap">
      </div>
      <div class="nav-links">
        <a href="#">Work</a>
        <a href="#">About</a>
        <a href="#">Resume</a>
      </div>
    </div>
  </nav>

  <section class="hero">

    <!-- Animated mountain background -->
    <div class="hero-mountain">
      <svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
        <defs>

          <!-- Soft edge blur for snow -->
          <filter id="snow-soft" x="-5%" y="-5%" width="110%" height="110%">
            <feGaussianBlur stdDeviation="3.5"/>
          </filter>

          <!-- Fog blur -->
          <filter id="fog-blur" x="-20%" y="-50%" width="140%" height="200%">
            <feGaussianBlur stdDeviation="14"/>
          </filter>
          <filter id="fog-blur-heavy" x="-20%" y="-50%" width="140%" height="200%">
            <feGaussianBlur stdDeviation="22"/>
          </filter>

          <!-- Slight blur on tree edges -->
          <filter id="tree-soft" x="-2%" y="-2%" width="104%" height="104%">
            <feGaussianBlur stdDeviation="1.2"/>
          </filter>

          <!-- Mountain body gradient: cool blue-gray left → warmer muted mauve right -->
          <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#8FA5B2" stop-opacity="0.7"/>
            <stop offset="42%"  stop-color="#A8BCC8" stop-opacity="0.65"/>
            <stop offset="68%"  stop-color="#BBA9A3" stop-opacity="0.65"/>
            <stop offset="100%" stop-color="#A89BA0" stop-opacity="0.6"/>
          </linearGradient>

          <!-- Left shadow face gradient -->
          <linearGradient id="shadow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#7090A4" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#7090A4" stop-opacity="0"/>
          </linearGradient>

          <!-- Warm right face gradient -->
          <linearGradient id="warm-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#C4A49A" stop-opacity="0"/>
            <stop offset="100%" stop-color="#C8A89E" stop-opacity="0.5"/>
          </linearGradient>

          <!-- Peak warm glow radial -->
          <radialGradient id="peak-warm-grad" cx="50%" cy="30%" r="40%" fx="50%" fy="30%">
            <stop offset="0%"   stop-color="#D4B5A8" stop-opacity="1"/>
            <stop offset="100%" stop-color="#D4B5A8" stop-opacity="0"/>
          </radialGradient>

          <!-- Fog gradient: fades left and right -->
          <linearGradient id="fog-fade-1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#C8D5DC" stop-opacity="0"/>
            <stop offset="15%"  stop-color="#C8D5DC" stop-opacity="1"/>
            <stop offset="85%"  stop-color="#C8D5DC" stop-opacity="1"/>
            <stop offset="100%" stop-color="#C8D5DC" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="fog-fade-2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#D5E0E5" stop-opacity="0"/>
            <stop offset="20%"  stop-color="#D5E0E5" stop-opacity="1"/>
            <stop offset="80%"  stop-color="#D5E0E5" stop-opacity="1"/>
            <stop offset="100%" stop-color="#D5E0E5" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="fog-fade-3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#E0E8EC" stop-opacity="0"/>
            <stop offset="10%"  stop-color="#E0E8EC" stop-opacity="0.8"/>
            <stop offset="90%"  stop-color="#E0E8EC" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#E0E8EC" stop-opacity="0"/>
          </linearGradient>

        </defs>

        <g class="mountain-scene">

          <!-- ── LAYER 1: Main mountain body ── -->
          <path
            d="M -20 420
               C  80 400  160 375  240 335
               C 310 300  380 250  440 190
               C 480 155  510 118  532 100
               L 548  96
               C 556 108  562 120  566 112
               C 572  78  580  68  588  80
               C 608  96  638 112  675 138
               C 730 168  790 210  860 258
               C 930 308 1010 358 1100 392
               L 1220 420 L 1220 490 L -20 490 Z"
            fill="url(#body-grad)"
          />

          <!-- ── LAYER 2: Left shadow face ── -->
          <path
            d="M 80 408
               C 160 388  240 355  320 310
               C 380 274  440 220  490 168
               L 532 100 L 548 96
               C 540 112  528 132  512 155
               C 470 205  420 248  360 288
               C 290 335  200 368  120 392 Z"
            fill="url(#shadow-grad)"
          />

          <!-- ── LAYER 3: Right warm face ── -->
          <path
            d="M 588  80
               C 618 100  652 118  688 142
               C 745 178  808 222  872 270
               C 940 320 1025 368 1120 400
               L 980 362
               C 898 318  828 272  766 228
               C 708 188  660 152  618 118 Z"
            fill="url(#warm-grad)"
          />

          <!-- ── LAYER 4: Peak warm glow ── -->
          <ellipse class="peak-warm" cx="572" cy="108" rx="135" ry="90"
            fill="url(#peak-warm-grad)" opacity="0.22"
          />

          <!-- ── LAYER 5: Snow cap (main) ── -->
          <path
            d="M 462 168
               C 478 148  496 126  514 108
               L 532 100 L 548  96
               C 554 106  560 116  566 112
               C 570  82  578  68  588  80
               C 608  96  638 112  660 128
               C 678 140  700 152  720 162
               C 698 172  672 162  648 168
               C 626 175  606 165  586 172
               C 566 164  546 174  526 166
               C 506 175  484 170  462 168 Z"
            fill="#EEEDF3" opacity="0.72"
            filter="url(#snow-soft)"
          />

          <!-- ── LAYER 6: Snow finger gullies ── -->
          <path d="M 512 108 C 506 132  504 160  508 185 C 500 165  498 138  502 118 Z"
            fill="#E8E6EF" opacity="0.55"/>
          <path d="M 548  96 C 543 118  540 148  545 175 C 537 155  535 124  539 105 Z"
            fill="#E8E6EF" opacity="0.5"/>
          <path d="M 478 148 C 472 168  470 194  475 218 C 466 198  464 170  468 152 Z"
            fill="#E8E6EF" opacity="0.4"/>

          <!-- ── LAYER 7: Shadow detail bands (topography) ── -->
          <path d="M 340 302 C 365 288  392 272  418 258 C 400 275  370 290  340 302 Z"
            fill="#6888A0" opacity="0.18"/>
          <path d="M 430 225 C 448 210  465 196  480 182 C 468 198  450 212  430 225 Z"
            fill="#6888A0" opacity="0.15"/>

          <!-- ── LAYER 8: Pine treeline silhouette ── -->
          <path
            d="M 138 368
               L 148 338 L 158 355
               L 166 332 L 176 350 L 182 320 L 192 342
               L 200 328 L 208 308 L 218 328 L 225 318 L 234 338
               L 242 322 L 252 298 L 262 318 L 270 308 L 280 328
               L 290 314 L 300 292 L 310 312 L 318 300 L 328 320
               L 338 306 L 348 285 L 358 306 L 366 295 L 376 314
               L 385 302 L 394 280 L 405 302 L 413 290 L 422 310
               L 432 298 L 441 275 L 452 298 L 460 286 L 470 308
               L 479 295 L 488 273 L 499 296 L 508 284 L 518 305
               L 527 292 L 537 272 L 548 295 L 556 282 L 567 305
               L 576 292 L 586 272 L 597 295 L 605 283 L 615 305
               L 625 292 L 634 274 L 645 295 L 653 284 L 663 305
               L 673 295 L 683 278 L 693 298 L 702 288 L 712 308
               L 721 298 L 730 280 L 740 302 L 749 292 L 759 312
               L 769 302 L 779 285 L 790 308 L 800 298 L 812 318
               L 822 308 L 832 292 L 845 316 L 855 308 L 868 328
               L 882 320 L 896 308 L 910 330 L 925 328 L 942 348
               L 942 388 L 138 388 Z"
            fill="#354A3C" opacity="0.55"
            filter="url(#tree-soft)"
          />

          <!-- ── LAYER 9: Fog bands ── -->
          <ellipse class="fog-a"
            cx="600" cy="375" rx="560" ry="38"
            fill="url(#fog-fade-1)" opacity="0.55"
            filter="url(#fog-blur)"
          />
          <ellipse class="fog-b"
            cx="600" cy="388" rx="490" ry="28"
            fill="url(#fog-fade-2)" opacity="0.45"
            filter="url(#fog-blur)"
          />
          <ellipse class="fog-c"
            cx="600" cy="400" rx="580" ry="22"
            fill="url(#fog-fade-3)" opacity="0.6"
            filter="url(#fog-blur-heavy)"
          />

        </g>
      </svg>
    </div>

    <!-- Hero text on top -->
    <div class="hero-inner">
      <p class="hero-text">Hi, I'm Prerna. Designer with a background in customer success, currently designing B2B2C experiences</p>
    </div>

  </section>

  <div class="preview-label">↑ Preview only — your files are untouched. Approve this and I'll apply it.</div>

</body>
</html>
