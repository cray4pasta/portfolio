  <style>
    /* ─── LAYOUT ─── The same box as the homepage's project cards: at most
       960px wide, at least 40px from each edge, centred, 20px below the
       nav. The page scrolls as one document, so split-scroll.js only
       handles the footer reveal. */
    .home-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      width: min(960px, 100% - 80px);
      margin: 0 auto;
      padding: 20px 0 160px;
    }
    .home-col:empty { display: none; }

    /* Intro line above the cards: the homepage's bio text, in the same
       520px column centred over the cards, 80px above them. 60px on top
       matches the About page's text, the same distance below the nav. */
    .fun-intro {
      width: min(520px, 100%);
      margin: 60px auto 80px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--gray-300);
      text-wrap: pretty;
    }

    /* ─── MEDIA GRID ─── Two equal columns, 20px apart, like the homepage
       video grid; each column stacks its items independently so a shorter
       one leaves no gap. */
    .fun-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: 20px;
    }
    .fun-col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

    /* Frame matches the homepage video cards: 4px corners and a faint
       hairline drawn inside the edge. */
    .fun-frame {
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      background: var(--gray-50, #f6f6f6);
      aspect-ratio: var(--ar);
    }
    .fun-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.06);
      pointer-events: none;
    }
    .fun-frame img,
    .fun-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .fun-frame img.media-loaded,
    .fun-frame video.media-loaded { opacity: 1; }

    /* Caption under each item, same type as the homepage captions */
    .fun-caption {
      margin-top: 12px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--gray-300);
      text-wrap: pretty;
    }

    .fun-item { margin: 0; }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .fun-grid { grid-template-columns: minmax(0, 1fr); }
    }
  </style>

  <script>
    // Fade in media once loaded, instead of popping in instantly
    document.querySelectorAll('.fun-frame img, .fun-frame video').forEach(el => {
      const markLoaded = () => el.classList.add('media-loaded');
      if (el.tagName === 'IMG') {
        if (el.complete && el.naturalWidth > 0) markLoaded();
        else el.addEventListener('load', markLoaded, { once: true });
      } else {
        if (el.readyState >= 2) markLoaded();
        else el.addEventListener('loadeddata', markLoaded, { once: true });
      }
    });
  </script>
