  <style>
    /* ─── TWO-COLUMN LAYOUT ─── Same grid as the homepage (index.html):
       fixed 320px intro column, coins take the rest, 80px apart, 40px
       from the page edges. */
    .home-grid {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      align-items: start;
      gap: 80px;
      margin: 0 40px;
      padding-top: 20px;
    }
    /* ─── SPLIT SCROLL (assets/split-scroll.js) ─── Each column scrolls on
       its own inside <main>, which the script sizes to end at the bottom of
       the viewport; past the end of both, the page lifts off the footer.
       Below 640px the columns stack into normal page flow. */
    main.split-stage { overflow: hidden; }
    .home-grid { height: 100%; align-items: stretch; }
    .home-col {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-bottom: 40px;
    }

    .home-bio {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      color: var(--gray-300);
      text-wrap: pretty;
    }
    .home-bio + .home-bio { margin-top: 20px; }
    .home-talk {
      margin-top: 20px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 400;
      line-height: 26px;
      text-transform: uppercase;
      color: var(--gray-400);
      text-decoration: none;
    }

    /* ─── COIN POSTER (assets/coin-poster.js) ─── */
    .coin-stage { position: relative; }
    .coin-stage-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    /* Four coins per row, 20px apart like the homepage video grid, capped
       at the same 960px (2 × 470 + 20) so rows stop growing on wide screens. */
    .coin-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px 20px; max-width: 960px; }
    .coin {
      appearance: none; background: none; border: 0; padding: 0; margin: 0;
      font: inherit; color: inherit; cursor: pointer; text-align: left;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .coin:focus-visible { outline: 1px solid var(--gray-400); outline-offset: 4px; border-radius: 4px; }
    /* 139px box → ~121px coin; the rest is room for the hover lean. */
    .coin-view { display: block; width: min(139px, 100%); aspect-ratio: 1; }
    .coin-view img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
    .coin-credits { margin-top: 40px; font-family: var(--font-sans); font-size: 12px; line-height: 16px; color: var(--gray-100); }
    .coin-credits a { color: inherit; }
    .coin-credits summary { cursor: pointer; list-style: none; width: fit-content; }
    .coin-credits summary::-webkit-details-marker { display: none; }
    .coin-credits summary::after { content: ' +'; }
    .coin-credits[open] summary::after { content: ' −'; }
    .coin-credits p { margin: 4px 0 0; max-width: 480px; }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 640px) {
      .home-grid { grid-template-columns: minmax(0, 1fr); height: auto; padding-bottom: 120px; }
      main.split-stage { overflow: visible; }
      .home-col { overflow-y: visible; padding-bottom: 0; }
      .coin-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
